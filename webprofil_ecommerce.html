<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Profil Diri</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f8f9fa;
    }
    header {
      background-color: #0d6efd;
      color: white;
      padding: 20px;
      text-align: center;
      border-radius: 10px;
    }
    .brand {
      font-size: 24px;
      font-weight: bold;
      color: #0d6efd;
      padding: 15px;
    }
    .menu {
      text-align: right;
    }
    .menu a {
      display: block;
      margin: 10px 0;
      color: #0d6efd;
      text-decoration: none;
      font-weight: 500;
    }
    .menu a:hover {
      text-decoration: underline;
    }
    .bio-box {
      background-color: white;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      box-shadow: 0px 4px 6px rgba(0,0,0,0.1);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    table, th, td {
      border: 1px solid #dee2e6;
    }
    th, td {
      text-align: center;
      padding: 15px;
    }
    .product-card {
      border: 1px solid #dee2e6;
      border-radius: 10px;
      padding: 15px;
      background: #fff;
      margin-bottom: 20px;
      text-align: center;
    }
    .product-card img {
      max-width: 100%;
      height: 150px;
      object-fit: cover;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <!-- Section 1: Header & Menu -->
  <div class="container mt-3">
    <div class="row">
      <!-- Kiri Brand -->
      <div class="col-md-3 d-flex align-items-center justify-content-center">
        <div class="brand">My Brand</div>
      </div>
      <!-- Kanan Menu -->
      <div class="col-md-9 menu">
        <header>
          <h1>Profil Diri Saya</h1>
        </header>
        <nav>
          <a href="#biodata">Biodata</a>
          <a href="#portofolio">Portofolio</a>
          <a href="#produk">Produk</a>
        </nav>
      </div>
    </div>
  </div>

  <!-- Section 2: Welcome -->
  <div class="container my-5">
    <div class="row align-items-center">
      <div class="col-md-6">
        <h2 class="text-primary">SELAMAT DATANG DI WEBSITE SAYA</h2>
      </div>
      <div class="col-md-6 text-center">
        <img src="https://via.placeholder.com/400x250" alt="Foto Profil" class="img-fluid rounded shadow">
      </div>
    </div>
  </div>

  <!-- Section 3: Biodata -->
  <div id="biodata" class="container my-5 text-center">
    <h2 class="text-primary">BIO DATA</h2>
    <p class="text-muted">Perkenalkan Diri Saya</p>
    <div class="row g-3">
      <div class="col-md-4"><div class="bio-box">Nama: John Doe</div></div>
      <div class="col-md-4"><div class="bio-box">Umur: 30 Tahun</div></div>
      <div class="col-md-4"><div class="bio-box">Alamat: Jakarta</div></div>
      <div class="col-md-4"><div class="bio-box">Pekerjaan: Developer</div></div>
      <div class="col-md-4"><div class="bio-box">Hobi: Membaca</div></div>
      <div class="col-md-4"><div class="bio-box">Email: johndoe@mail.com</div></div>
    </div>
  </div>

  <!-- Section 4: Portofolio -->
  <div id="portofolio" class="container my-5">
    <h2 class="text-center text-primary mb-4">Portofolio</h2>
    <table class="table table-bordered">
      <tr>
        <th>Company Profile</th>
        <th>Sistem Keuangan</th>
        <th>Desain Digital</th>
      </tr>
      <tr>
        <td><img src="https://via.placeholder.com/250x150" alt="Company Profile" class="img-fluid"></td>
        <td><img src="https://via.placeholder.com/250x150" alt="Sistem Keuangan" class="img-fluid"></td>
        <td><img src="https://via.placeholder.com/250x150" alt="Desain Digital" class="img-fluid"></td>
      </tr>
    </table>
  </div>

  <!-- Section 5: Produk E-Commerce -->
  <div id="produk" class="container my-5">
    <h2 class="text-center text-success mb-4">Daftar Produk</h2>

    <!-- Filter -->
    <div class="text-center mb-4">
      <button class="btn btn-outline-primary mx-2" onclick="filterProduk('all')">Semua</button>
      <button class="btn btn-outline-primary mx-2" onclick="filterProduk('elektronik')">Elektronik</button>
      <button class="btn btn-outline-primary mx-2" onclick="filterProduk('fashion')">Fashion</button>
      <button class="btn btn-outline-primary mx-2" onclick="filterProduk('aksesoris')">Aksesoris</button>
    </div>

    <!-- Produk Grid -->
    <div class="row" id="produkList"></div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- JavaScript Produk -->
  <script>
    // Array data produk
    const produk = [
      { nama: "Laptop Pro X", harga: "Rp 12.000.000", deskripsi: "Laptop canggih untuk kerja profesional.", gambar: "https://via.placeholder.com/200x150", kategori: "elektronik" },
      { nama: "Smartphone Z", harga: "Rp 5.500.000", deskripsi: "Smartphone modern dengan kamera 108MP.", gambar: "https://via.placeholder.com/200x150", kategori: "elektronik" },
      { nama: "Jaket Kulit", harga: "Rp 850.000", deskripsi: "Jaket kulit asli, nyaman dipakai.", gambar: "https://via.placeholder.com/200x150", kategori: "fashion" },
      { nama: "Jam Tangan", harga: "Rp 1.200.000", deskripsi: "Jam tangan elegan dengan desain klasik.", gambar: "https://via.placeholder.com/200x150", kategori: "aksesoris" },
      { nama: "Sepatu Sport", harga: "Rp 650.000", deskripsi: "Sepatu ringan untuk olahraga.", gambar: "https://via.placeholder.com/200x150", kategori: "fashion" },
    ];

    // Fungsi tampil produk
    function tampilProduk(list) {
      const produkList = document.getElementById("produkList");
      produkList.innerHTML = "";
      list.forEach(item => {
        produkList.innerHTML += `
          <div class="col-md-4">
            <div class="product-card">
              <img src="${item.gambar}" alt="${item.nama}">
              <h5>${item.nama}</h5>
              <p><strong>${item.harga}</strong></p>
              <p>${item.deskripsi}</p>
              <button class="btn btn-sm btn-primary">Beli Sekarang</button>
            </div>
          </div>
        `;
      });
    }

    // Fungsi filter produk
    function filterProduk(kategori) {
      if (kategori === "all") {
        tampilProduk(produk);
      } else {
        const hasil = produk.filter(item => item.kategori === kategori);
        tampilProduk(hasil);
      }
    }

    // Tampilkan semua produk pertama kali
    tampilProduk(produk);
  </script>
</body>
</html>
